version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexusops-postgres
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: nexusops_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nexusops-redis
    ports:
      - "6379:6379"

  api-gateway:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.gateway
    container_name: nexusops-api-gateway
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - GATEWAY_PORT=8080

volumes:
  pgdata:
