        extend: {

            brand: {

              600: '#059669',

              900: '#0f172a',

</head>

            <input type="checkbox" id="login-remember" class="rounded bg-slate-800 border-slate-700 text-emerald-500 focus:ring-emerald-500 focus:ring-offset-slate-900">
            <span>Remember me</span>

          <span class="text-slate-500">Local Enterprise Auth</span>
        </div>

        <!-- Error Banner -->
        <div id="login-error" class="hidden p-3 rounded-lg bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs flex items-center space-x-2">

    <!-- Main Workspace (Sidebar + Content) -->
    <div class="flex-1 flex overflow-hidden">
      
      <!-- Sidebar Navigation -->
      <aside class="w-60 bg-slate-900/90 border-r border-slate-800 flex flex-col justify-between p-3 flex-shrink-0 select-none overflow-y-auto custom-scrollbar">
        <div class="space-y-1">
          <p class="text-[10px] font-semibold text-slate-500 uppercase tracking-wider px-3 mb-2">Core Services</p>
          
          <button onclick="navigatePage('dashboard')" class="nav-item w-full flex items-center space-x-3 px-3 py-2 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition" data-page="dashboard">

          <button onclick="navigatePage('pipelines')" class="nav-item w-full flex items-center space-x-3 px-3 py-2 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition" data-page="pipelines">

          <button onclick="navigatePage('deployments')" class="nav-item w-full flex items-center space-x-3 px-3 py-2 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition" data-page="deployments">

          <button onclick="navigatePage('infrastructure')" class="nav-item w-full flex items-center space-x-3 px-3 py-2 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition" data-page="infrastructure">

          <button onclick="navigatePage('monitoring')" class="nav-item w-full flex items-center space-x-3 px-3 py-2 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition" data-page="monitoring">

          <button onclick="navigatePage('logs')" class="nav-item w-full flex items-center space-x-3 px-3 py-2 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition" data-page="logs">
            <i class="fa-solid fa-terminal w-4 text-yellow-400"></i>
            <span>Central Logs</span>
          </button>

          <button onclick="navigatePage('audit')" class="nav-item w-full flex items-center space-x-3 px-3 py-2 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition" data-page="audit">
            <i class="fa-solid fa-link w-4 text-emerald-400"></i>

      <!-- Main Dynamic Content Region -->
      <main class="flex-1 bg-slate-950 overflow-y-auto p-6 custom-scrollbar" id="content-area">

    </div>

  <!-- ========================================================================= -->
  <!-- 3. JAVASCRIPT LOGIC & API CLIENT -->
  <!-- ========================================================================= -->
  <script>
    // --- State Variables ---
    let currentUser = null;
    let authToken = localStorage.getItem('flint_token') || '';
    let currentPage = 'dashboard';
    let pollInterval = null;

    // --- API Request Wrapper ---
    async function apiRequest(endpoint, method = 'GET', data = null) {
      const headers = { 'Content-Type': 'application/json' };
      if (authToken) {
        headers['Authorization'] = `Bearer ${authToken}`;
      }

      const options = { method, headers };
      if (data && method !== 'GET') {
        options.body = JSON.stringify(data);
      }

      try {
        const response = await fetch(endpoint, options);
        if (response.status === 401) {
          showToast('Session expired. Please sign in.', 'error');
          handleLogout();
          return null;
        }
        if (response.status === 403) {
          showToast('Forbidden: Your role does not have permission for this action.', 'error');
          return null;
        }
        const resData = await response.json();
        if (!response.ok) {
          showToast(resData.error || 'Operation failed', 'error');
          return null;
        }
        return resData;
      } catch (err) {
        console.error('API Error on', endpoint, err);
        showToast('Network error connecting to Flint control plane', 'error');
        return null;
      }
    }

    // --- Toast Notification System ---
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const icons = {
        success: 'fa-circle-check text-emerald-400',
        error: 'fa-triangle-exclamation text-rose-400',
        warning: 'fa-circle-exclamation text-amber-400',
        info: 'fa-circle-info text-blue-400'
      };
      const borders = {
        success: 'border-emerald-500/30 bg-slate-900',
        error: 'border-rose-500/30 bg-slate-900',
        warning: 'border-amber-500/30 bg-slate-900',
        info: 'border-blue-500/30 bg-slate-900'
      };

      toast.className = `pointer-events-auto flex items-center space-x-3 px-4 py-3 rounded-xl border ${borders[type]} text-slate-100 text-xs shadow-xl transition-all duration-300 transform translate-y-2 opacity-0`;
      toast.innerHTML = `
        <i class="fa-solid ${icons[type]} text-base flex-shrink-0"></i>
        <span class="flex-1">${message}</span>
      `;

      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      }, 10);

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    // --- Password Visibility Toggle ---
    function togglePasswordVisibility(fieldId) {
      const field = document.getElementById(fieldId);
      const eye = document.getElementById(fieldId + '-eye');
      if (field.type === 'password') {
        field.type = 'text';
        eye.classList.remove('fa-eye');
        eye.classList.add('fa-eye-slash');
      } else {
        field.type = 'password';
        eye.classList.remove('fa-eye-slash');
        eye.classList.add('fa-eye');
      }
    }

    // --- Quick Demo Login Helper ---
    function quickFill(email, pwd) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = pwd;
      document.getElementById('login-form').dispatchEvent(new Event('submit'));
    }

    // --- Authentication Handlers ---
    async function handleLogin(e) {
      if (e) e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const errorDiv = document.getElementById('login-error');
      const errorText = document.getElementById('login-error-text');
      const btnText = document.getElementById('login-btn-text');
      const spinner = document.getElementById('login-btn-spinner');

      errorDiv.classList.add('hidden');
      btnText.textContent = 'Verifying...';
      spinner.classList.remove('hidden');

      const res = await apiRequest('/auth/login', 'POST', { email, password });
      btnText.textContent = 'Sign In';
      spinner.classList.add('hidden');

      if (res && res.token) {
        authToken = res.token;
        currentUser = res.user;
        localStorage.setItem('flint_token', authToken);
        showToast(`Welcome back, ${currentUser.name}!`, 'success');
        renderAppShell();
      } else {
        errorText.textContent = 'Invalid email or password. Please try again.';
        errorDiv.classList.remove('hidden');
      }
    }

    async function handleLogout() {
      if (authToken) {
        await apiRequest('/auth/logout', 'POST');
      }
      authToken = '';
      currentUser = null;
      localStorage.removeItem('flint_token');
      document.getElementById('view-app').classList.add('hidden');
      document.getElementById('view-login').classList.remove('hidden');
      if (pollInterval) clearInterval(pollInterval);
    }

    // --- Navigation & View Rendering ---
    function navigatePage(pageName) {
      currentPage = pageName;
      
      // Update sidebar active states
      document.querySelectorAll('.nav-item').forEach(btn => {
        if (btn.dataset.page === pageName) {
          btn.classList.add('bg-slate-800', 'text-white', 'border-l-2', 'border-emerald-500');
          btn.classList.remove('text-slate-300');
        } else {
          btn.classList.remove('bg-slate-800', 'text-white', 'border-l-2', 'border-emerald-500');
          btn.classList.add('text-slate-300');
        }
      });

      const container = document.getElementById('content-area');
      container.innerHTML = '<div class="flex items-center justify-center h-64 text-slate-500"><i class="fa-solid fa-circle-notch fa-spin text-2xl"></i></div>';

      switch (pageName) {
        case 'dashboard': renderDashboardView(); break;
        case 'pipelines': renderPipelinesView(); break;
        case 'deployments': renderDeploymentsView(); break;
        case 'infrastructure': renderInfrastructureView(); break;
        case 'security': renderSecurityView(); break;
        case 'gitops': renderGitOpsView(); break;
        case 'runners': renderRunnersView(); break;
        case 'monitoring': renderMonitoringView(); break;
        case 'logs': renderLogsView(); break;
        case 'audit': renderAuditView(); break;
        case 'reports': renderReportsView(); break;
        case 'users': renderUsersView(); break;
        case 'settings': renderSettingsView(); break;
        default: renderDashboardView();
      }
    }

    function renderAppShell() {
      document.getElementById('view-login').classList.add('hidden');
      document.getElementById('view-app').classList.remove('hidden');

      document.getElementById('user-email-display').textContent = currentUser.email;
      document.getElementById('user-role-display').textContent = currentUser.role;
      document.getElementById('user-avatar').textContent = currentUser.name.charAt(0).toUpperCase();

      // Role based menu adjustments
      const userBtn = document.getElementById('nav-users-btn');
      if (currentUser.role !== 'ADMIN') {
        userBtn.classList.add('opacity-40');
      } else {
        userBtn.classList.remove('opacity-40');
      }

      navigatePage('dashboard');
    }

    // --- Check Existing Session on Startup ---
    async function checkExistingSession() {
      if (!authToken) {
        document.getElementById('view-login').classList.remove('hidden');
        return;
      }
      const res = await apiRequest('/auth/session', 'GET');
      if (res && res.authenticated) {
        currentUser = res.user;
        renderAppShell();
      } else {
        handleLogout();
      }
    }

    // =========================================================================
    // 4. SCREEN COMPONENT RENDERERS
    // =========================================================================

    // --- 4.1 DASHBOARD VIEW ---

      const mode = document.querySelector('input[name="sim_mode"]:checked').value;
      closeModal();
      showToast('Dispatching DAG pipeline workflow to runner agent...', 'info');

      const res = await apiRequest(`/api/pipelines/${pipeId}/run`, 'POST', { simulation_mode: mode });
      if (res) {
        if (res.status === 'COMPLETED') {
          showToast(`Pipeline ${res.pipeline_name} completed successfully!`, 'success');
        } else {
          showToast(`Pipeline ${res.pipeline_name} failed: ${res.failure_reason}`, 'error');
        }
        navigatePage('pipelines');
      }
    }

    async function handleCreatePipeline(e) {

      const name = document.getElementById('new-pipe-name').value;

      const repository = document.getElementById('new-pipe-repo').value;
      const branch = document.getElementById('new-pipe-branch').value;

        {"id": "security-scan", "name": "Security & OPA Scan", "depends_on": ["checkout"]},
        {"id": "unit-tests", "name": "Unit Tests", "depends_on": ["checkout"]},

        {"id": "deploy-canary", "name": "Canary Rollout", "depends_on": ["container-build"]}

      closeModal();
      const res = await apiRequest('/api/pipelines', 'POST', { name, description, repository, branch, stages });
      if (res) {

        navigatePage('pipelines');

    }

    // --- 4.10 AUDIT TRAIL VIEW (SHA-256 Hash Chaining) ---
    async function renderAuditView() {
      const data = await apiRequest('/api/audit');
      if (!data) return;

      const chain = data.audit_chain || [];
      const container = document.getElementById('content-area');
      container.innerHTML = `
        <div class="space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 class="text-xl font-bold text-white tracking-tight">Cryptographic Hash-Chained Audit Log</h2>
              <p class="text-xs text-slate-400">SOC2 / ISO 27001 compliant SHA-256 tamper-evident transaction ledger</p>
            </div>
            <button onclick="verifyAuditTrail()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-semibold transition flex items-center space-x-2">
              <i class="fa-solid fa-shield-halved"></i>
              <span>Verify Chain Integrity</span>
            </button>
          </div>

          <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs font-mono">
                <thead class="bg-slate-850 text-slate-400 text-[10px] uppercase">
                  <tr>
                    <th class="p-3">Seq #</th>
                    <th class="p-3">Timestamp</th>
                    <th class="p-3">User</th>
                    <th class="p-3">Action</th>
                    <th class="p-3">Resource</th>
                    <th class="p-3">Current Hash (SHA-256)</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800 text-slate-300 text-[11px]">
                  ${chain.map(entry => `
                    <tr class="hover:bg-slate-850/50 transition">
                      <td class="p-3 font-bold text-emerald-400">#${entry.sequence_number}</td>
                      <td class="p-3 text-slate-500">${new Date(entry.timestamp * 1000).toLocaleTimeString()}</td>
                      <td class="p-3 text-slate-300">${entry.user_email}</td>

                      <td class="p-3 text-slate-500 truncate max-w-[200px]" title="${entry.current_hash}">${entry.current_hash}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    async function verifyAuditTrail() {
      showToast('Recalculating SHA-256 cryptographic chain...', 'info');
      const res = await apiRequest('/api/audit/verify', 'POST');
      if (res) {
        if (res.is_valid) {
          showToast(`Audit Ledger 100% Intact (${res.total_records} chained records verified tamper-free)`, 'success');
        } else {
          showToast(`Audit integrity compromise detected! ${res.message}`, 'error');
        }
      }
    }

    function exportReportJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({
        platform: "Flint",
        timestamp: new Date().toISOString(),
        scorecard: { security_grade: "A+", dora_tier: "Elite" }
      }, null, 2));
      const dlAnchorElem = document.createElement('a');
      dlAnchorElem.setAttribute("href", dataStr);

      dlAnchorElem.click();

    function openCreateUserModal() {

    async function handleCreateUser(e) {
      e.preventDefault();
      const name = document.getElementById('new-user-name').value;
      const email = document.getElementById('new-user-email').value;
      const password = document.getElementById('new-user-pwd').value;
      const role = document.getElementById('new-user-role').value;

      closeModal();
      const res = await apiRequest('/api/users', 'POST', { name, email, password, role });
      if (res) {
        showToast(`User ${email} created successfully!`, 'success');
        navigatePage('users');
      }
    }

    async function toggleUserStatus(userId) {
      const res = await apiRequest(`/api/users/${userId}/toggle`, 'POST');
      if (res) {
        showToast('User status updated.', 'info');
        navigatePage('users');
      }
    }

    async function handleSaveSettings(e) {

    // Modal Closer
    function closeModal() {
      document.getElementById('modal-container').classList.add('hidden');
    }

    // Initialize application on load
    window.addEventListener('DOMContentLoaded', () => {
      checkExistingSession();
    });
