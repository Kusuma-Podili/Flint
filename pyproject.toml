[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexusops"
version = "1.0.0"
description = "Enterprise DevOps Automation & Deployment Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.3",
    "cryptography>=42.0.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "websockets>=12.0",
    "redis>=5.0.1",
    "jinja2>=3.1.3"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "flake8>=7.0.0",
    "black>=24.1.0"
]
